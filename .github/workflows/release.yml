name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/airfile.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/airfile.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret set; the APK will be signed with the debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="${GITHUB_RUN_NUMBER}"
          gradle test assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "AirFile-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: AirFile-*.apk
          generate_release_notes: true
