name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the APK to (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/airfile.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/airfile.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret set; the APK will be signed with the debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${TAG#v}"
          export VERSION_CODE="${GITHUB_RUN_NUMBER}"
          gradle test assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "AirFile-${TAG}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: AirFile-*.apk
          generate_release_notes: true
